name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The runner has no GPU; this only lets pixi accept the platform the lock file targets.
      CONDA_OVERRIDE_CUDA: "12.9"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: lint
      - run: pixi run -e lint check
