[project]
name = "tokimeki"
version = "0.1.0"
description = "Turn the cute moments of anime heroines into MADs: a scene library first, music-synced cuts next"
authors = [{ name = "ykiko", email = "ykikoykikoykiko@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
tokimeki = "tokimeki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.9" }]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
pillow = "*"

[tool.pixi.pypi-dependencies]
tokimeki = { path = ".", editable = true }

[tool.pixi.feature.gpu.dependencies]
ffmpeg = "*"
cuda-version = "12.9.*"
pytorch-gpu = "*"
onnxruntime = { version = "*", build = "*cuda*" }
huggingface_hub = "*"
pandas = "*"
tqdm = "*"

[tool.pixi.feature.gpu.pypi-dependencies]
transnetv2-pytorch = "==1.0.5"
silero-vad = "==6.2.3"

# Type checking needs PyTorch's annotations, not its CUDA libraries; CI runners have no GPU.
[tool.pixi.feature.typing.dependencies]
pytorch-cpu = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
basedpyright = "*"
pytest = "*"

[tool.pixi.environments]
default = { features = ["gpu", "dev"], solve-group = "default" }
lint = { features = ["typing", "dev"] }

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "basedpyright"
test = "pytest"
check = { depends-on = ["lint", "format-check", "typecheck"] }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU with NVDEC, CUDA PyTorch and CUDA onnxruntime"]
