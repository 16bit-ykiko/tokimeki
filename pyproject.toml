[project]
name = "tokimeki"
version = "0.1.0"
description = "Turn the cute moments of anime heroines into MADs: a scene library first, music-synced cuts next"
authors = [{ name = "ykiko", email = "ykikoykikoykiko@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
ffmpeg = "*"

[tool.pixi.pypi-dependencies]
tokimeki = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
basedpyright = "*"
pytest = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "basedpyright"
test = "pytest"
check = { depends-on = ["lint", "format-check", "typecheck"] }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
